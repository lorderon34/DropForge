name: Publicar site do DropForge

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dropforge-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'lorderon34/DropForge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Incluir prova de controle para o IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.DROPFORGE_INDEXNOW_KEY }}
        run: |
          if [[ "$INDEXNOW_KEY" =~ ^[a-f0-9]{32}$ ]]; then
            printf '%s' "$INDEXNOW_KEY" > "docs/$INDEXNOW_KEY.txt"
          fi

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs

      - name: Publicar página
        id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
